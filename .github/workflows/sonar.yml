name: SonarCloud analysis with JDK 21 on Ubuntu

on:
    push:
        branches:
        - master
    pull_request:
        branches:
        - master
    workflow_dispatch: {}

# cancel superseded runs on the same branch/PR to save CI minutes.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:

    build:
        runs-on: ubuntu-latest
        # skip the analysis job on forks, which lack the SONAR_TOKEN secret and access
        # to the spannm SonarCloud organization
        if: ${{ github.repository == 'spannm/ucanaccess' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        steps:
        -   uses: actions/checkout@v7
            with:
                # disabling shallow clone is recommended for improving relevancy of reporting
                fetch-depth: 0

        -   name: Set up JDK 21
            uses: actions/setup-java@v6
            with:
                java-version: '21'
                distribution: temurin
                cache: maven

        -   name: Cache SonarQube packages
            uses: actions/cache@v4
            with:
                path: ~/.sonar/cache
                key: ${{ runner.os }}-sonar
                restore-keys: ${{ runner.os }}-sonar

        -   name: Build with Maven/JDK 21, test with SonarCloud
            env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
            run: >
                mvn --batch-mode --file pom.xml verify
                org.sonarsource.scanner.maven:sonar-maven-plugin:5.5.0.6356:sonar
                -Dsonar.organization=spannm
                -Dsonar.projectKey=io.github.spannm:ucanaccess
                -Dsonar.host.url=https://sonarcloud.io
